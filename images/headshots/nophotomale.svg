<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c3036"/>
      <stop offset="100%" stop-color="#1a1d21"/>
    </linearGradient>
    <linearGradient id="silhouette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5260"/>
      <stop offset="100%" stop-color="#353b47"/>
    </linearGradient>
    <clipPath id="card">
      <rect width="400" height="400" rx="0"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Subtle bottom accent bar -->
  <rect x="0" y="360" width="400" height="40" fill="#38B6FF" opacity="0.08"/>

  <!-- Silhouette: shoulders / body -->
  <path d="M-10 400 Q60 280 140 265 Q170 258 200 258 Q230 258 260 265 Q340 280 410 400 Z" fill="url(#silhouette)"/>

  <!-- Silhouette: head (circle) -->
  <circle cx="200" cy="168" r="72" fill="url(#silhouette)"/>

  <!-- URU blue top accent line -->
  <rect x="0" y="0" width="400" height="4" fill="#38B6FF" opacity="0.6"/>

  <!-- Bottom text -->
  <text x="200" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#38B6FF" letter-spacing="3" opacity="0.5">URU SOCCER</text>
</svg>
