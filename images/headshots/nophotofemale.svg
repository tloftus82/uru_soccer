<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c3036"/>
      <stop offset="100%" stop-color="#1a1d21"/>
    </linearGradient>
    <linearGradient id="silhouette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5260"/>
      <stop offset="100%" stop-color="#353b47"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Subtle bottom accent bar -->
  <rect x="0" y="360" width="400" height="40" fill="#38B6FF" opacity="0.08"/>

  <!-- Silhouette: shoulders / body (slightly wider neckline for female) -->
  <path d="M-10 400 Q55 275 135 262 Q168 254 200 254 Q232 254 265 262 Q345 275 410 400 Z" fill="url(#silhouette)"/>

  <!-- Silhouette: head -->
  <circle cx="200" cy="165" r="72" fill="url(#silhouette)"/>

  <!-- Long hair sides -->
  <path d="M134 148 Q118 200 124 270 Q148 278 152 265 Q142 210 148 162 Z" fill="url(#silhouette)"/>
  <path d="M266 148 Q282 200 276 270 Q252 278 248 265 Q258 210 252 162 Z" fill="url(#silhouette)"/>

  <!-- URU blue top accent line -->
  <rect x="0" y="0" width="400" height="4" fill="#38B6FF" opacity="0.6"/>

  <!-- Bottom text -->
  <text x="200" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#38B6FF" letter-spacing="3" opacity="0.5">URU SOCCER</text>
</svg>
